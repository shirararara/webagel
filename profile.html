<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профиль | Webagel</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="profile">
    <h1>Мой профиль</h1>

    <img id="avatar" class="avatar" src="https://placehold.co/150" alt="Avatar">
    <br><br>
    <input type="file" id="avatarFile" accept="image/*">
    <br><br>
    <input id="username" type="text" placeholder="Имя пользователя">
    <br><br>
    <textarea id="bio" placeholder="О себе"></textarea>
    <br><br>

    <div class="follow-stats">
        <span id="followersCount" class="follow-stat">0 подписчиков</span>
        <span id="followingCount" class="follow-stat">0 подписок</span>
    </div>

    <br>
    <button id="saveBtn">Сохранить профиль</button>
    <br><br>
    <a href="search.html">🔍 Найти пользователей</a>
    <br><br>
    <a href="index.html">← На главную</a>

    <hr class="profile-divider">

    <h2 class="profile-feed-title">Мои публикации</h2>
    <div id="feed"></div>
</div>

<!-- Post modal -->
<div id="postModal">
    <div id="modalContent">
        <div id="modalImageSide"></div>
        <div id="modalInfoSide"></div>
    </div>
</div>

<script type="module" src="js/profile.js"></script>
</body>
</html>
