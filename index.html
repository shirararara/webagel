<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Webagel
    </title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">

            Webagel

        </div>

        <nav>

            <a href="index.html">
                🏠 Главная
            </a>

            <a href="profile.html">
                👤 Профиль
            </a>

            <a href="#">
                🔍 Поиск
            </a>

            <a href="#">
                🔔 Уведомления
            </a>

            <a href="#">
                ⚙ Настройки
            </a>

        </nav>

        <button id="logoutBtn">

            🚪 Выйти

        </button>

    </aside>

    <main class="main-content">

        <section class="welcome-card">

            <h1>

                Добро пожаловать в Webagel

            </h1>

            <p>

                Делитесь игровыми моментами с друзьями.

            </p>

        </section>

        <section class="create-post">

            <h2>

                Создать публикацию

            </h2>

            <input
                type="file"
                id="postImage"
                accept="image/*">

            <textarea
                id="postText"
                placeholder="Что произошло в игре?">
            </textarea>

            <button id="publishBtn">

                Опубликовать

            </button>

        </section>

        <section class="feed-section">

            <h2>

                Лента

            </h2>

            <div id="feed"></div>

        </section>

    </main>

</div>

<script
    type="module"
    src="js/app.js">
</script>

<script
    type="module"
    src="js/posts.js">
</script>

</body>

</html>
