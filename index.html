<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icons/logo.png">
    <title>Webagel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

    <!-- TOP BAR (dark) -->
    <header class="topbar">
        <div class="topbar-logo">
            <img src="icons/logo-transparent.png" alt="Webagel">
            <span class="topbar-name">Webagel</span>
        </div>
        <button class="notify-btn" title="Уведомления">⚡</button>
    </header>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <nav>
            <a href="index.html" class="active">
                <span class="sidebar-icon">✦</span>
                <span>Рекомендации</span>
            </a>
            <a href="#">
                <span class="sidebar-icon">📣</span>
                <span>Уведомления</span>
            </a>
            <a href="profile.html">
                <span class="sidebar-icon">👤</span>
                <span>Профиль</span>
            </a>
            <a href="search.html">
                <span class="sidebar-icon">🔍</span>
                <span>Поиск</span>
            </a>
            <a href="#">
                <span class="sidebar-icon">🎯</span>
                <span>Центр авторов</span>
            </a>
        </nav>

        <button id="publishFloatBtn">
            <span>＋</span>
            <span>Опубликовать</span>
        </button>

        <button id="logoutBtn">
            <span class="sidebar-icon">🚪</span>
            <span>Выйти</span>
        </button>
    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <div class="topbar-spacer"></div>

        <!-- Search + filters -->
        <div class="search-bar-wrapper">
            <button class="filter-pill">Рекомендации 🩷</button>
            <button class="filter-pill">Все языки 🩷</button>
            <input type="text" class="main-search-input" placeholder="Поиск">
        </div>

        <!-- Feed -->
        <section class="feed-section">
            <div id="feed"></div>
        </section>

    </main>

</div>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/posts.js"></script>

<!-- Create post modal -->
<div id="createPostModal">
    <div id="createPostContent">
        <div id="createPostImageSide">
            <label id="imageDropZone">
                <input type="file" id="postImage" accept="image/*">
                <div id="imagePreview">
                    <span id="imageDropHint">📷 Нажмите, чтобы добавить фото</span>
                </div>
            </label>
        </div>
        <div id="createPostInfoSide">
            <h2>Новая публикация</h2>
            <hr>
            <textarea id="postText" placeholder="Что произошло в игре?"></textarea>
            <div id="createPostActions">
                <button id="cancelPostBtn">Отмена</button>
                <button id="publishBtn">Опубликовать</button>
            </div>
        </div>
    </div>
</div>

<!-- Post modal -->
<div id="postModal">
    <div id="modalContent">
        <div id="modalImageSide"></div>
        <div id="modalInfoSide"></div>
    </div>
</div>

</body>
</html>
