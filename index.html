<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icons/logo.png">
    <title>Webagel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

    <!-- TOP BAR (dark) -->
    <header class="topbar">
        <div class="topbar-logo">
            <img src="icons/logo-transparent.png" alt="Webagel">
            <span class="topbar-name">Webagel</span>
        </div>
        <button class="notify-btn" title="Уведомления">⚡</button>
    </header>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <nav>
            <a href="index.html" class="active">
                <span class="sidebar-icon">✦</span>
                <span>Рекомендации</span>
            </a>
            <a href="#">
                <span class="sidebar-icon">📣</span>
                <span>Уведомления</span>
            </a>
            <a href="profile.html">
                <span class="sidebar-icon">👤</span>
                <span>Профиль</span>
            </a>
            <a href="search.html">
                <span class="sidebar-icon">🔍</span>
                <span>Поиск</span>
            </a>
            <a href="author-center.html">
                <span class="sidebar-icon">🎯</span>
                <span>Центр авторов</span>
            </a>
        </nav>

        <button id="publishFloatBtn">
            <span>＋</span>
            <span>Опубликовать</span>
        </button>

        <button id="logoutBtn">
            <span class="sidebar-icon">🚪</span>
            <span>Выйти</span>
        </button>
    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <div class="topbar-spacer"></div>

        <!-- Search + filters -->
        <div class="search-bar-wrapper">
            <div class="dropdown-wrapper" id="filterDropdownWrapper">
                <button class="filter-pill" id="filterBtn">Фильтр ▾</button>
                <div class="dropdown-menu" id="filterMenu">
                    <label class="dropdown-item">
                        <input type="checkbox" id="filterFollowing">
                        <span>Только подписки</span>
                    </label>
                    <label class="dropdown-item">
                        <input type="checkbox" id="filterOnlyGif">
                        <span>Только GIF</span>
                    </label>
                    <label class="dropdown-item">
                        <input type="checkbox" id="filterNoGif">
                        <span>Без GIF</span>
                    </label>
                </div>
            </div>
            <div class="dropdown-wrapper" id="sortDropdownWrapper">
                <button class="filter-pill" id="sortBtn">Сортировка ▾</button>
                <div class="dropdown-menu" id="sortMenu">
                    <label class="dropdown-item">
                        <input type="radio" name="sortOrder" value="newest" checked>
                        <span>Недавние</span>
                    </label>
                    <label class="dropdown-item">
                        <input type="radio" name="sortOrder" value="oldest">
                        <span>Давние</span>
                    </label>
                    <label class="dropdown-item">
                        <input type="radio" name="sortOrder" value="most_likes">
                        <span>Много лайков</span>
                    </label>
                    <label class="dropdown-item">
                        <input type="radio" name="sortOrder" value="least_likes">
                        <span>Мало лайков</span>
                    </label>
                    <label class="dropdown-item">
                        <input type="radio" name="sortOrder" value="most_comments">
                        <span>Много комментариев</span>
                    </label>
                    <label class="dropdown-item">
                        <input type="radio" name="sortOrder" value="least_comments">
                        <span>Мало комментариев</span>
                    </label>
                </div>
            </div>
            <input type="text" class="main-search-input" id="mainSearchInput" placeholder="Поиск по публикациям">
        </div>

        <!-- Feed -->
        <section class="feed-section">
            <div id="feed"></div>
        </section>

    </main>

</div>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/posts.js"></script>

<!-- Create post modal -->
<div id="createPostModal">
    <div id="createPostContent">
        <div id="createPostImageSide">
            <label id="imageDropZone">
                <input type="file" id="postImage" accept="image/*">
                <div id="imagePreview">
                    <span id="imageDropHint">📷 Нажмите, чтобы добавить фото</span>
                </div>
            </label>
        </div>
        <div id="createPostInfoSide">
            <h2>Новая публикация</h2>
            <hr>
            <textarea id="postText" placeholder="Что произошло в игре?"></textarea>
            <div id="createPostActions">
                <button id="cancelPostBtn">Отмена</button>
                <button id="publishBtn">Опубликовать</button>
            </div>
        </div>
    </div>
</div>

<!-- Post modal -->
<div id="postModal">
    <div id="modalContent">
        <div id="modalImageSide"></div>
        <div id="modalInfoSide"></div>
    </div>
</div>

</body>
</html>
